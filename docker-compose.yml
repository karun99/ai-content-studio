version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: serve
    restart: unless-stopped

  # NVIDIA NIM server (requires authentication and GPU)
  # Uncomment and configure if you have NIM access
  # nvidia-nim:
  #   image: nvcr.io/nvidia/nim:llama3-8b
  #   ports:
  #     - "8002:8002"
  #   environment:
  #     - NGC_API_KEY=${NGC_API_KEY}
  #   volumes:
  #     - nim_cache:/opt/nim/.cache
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CHROMA_URL=http://chromadb:8000
      - OLLAMA_URL=http://ollama:11434
      - LLAMACPP_URL=http://host.docker.internal:8080
      - HF_SERVICE_URL=http://host.docker.internal:8001
      - NVIDIA_NIM_ENDPOINT=http://host.docker.internal:8002/v1
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    depends_on:
      - chromadb
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
  ollama_data:
  nim_cache:
